{{ define "main" }}

<div class="universal-wrapper">
  <h1>{{ .Title }}</h1>

  {{ with .Content }}
  <div class="article-style mb-5">
    {{ . }}
  </div>
  {{ end }}

  {{ range .Pages }}
    <div class="news-item-card">
      <h3 class="article-title mb-2 mt-0">
        {{ .Title }}
      </h3>
      <div class="article-style">
        {{ .Content }}
      </div>
    </div>
  {{ end }}
</div>

{{ end }}
